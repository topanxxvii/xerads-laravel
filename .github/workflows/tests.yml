name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every supported Laravel release on every PHP version it supports. The
  # package ships no lock file, so each row resolves its own dependency set,
  # exactly as an application installing it would.
  framework:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    # The Laravel 14 row runs against unreleased code and may break for
    # reasons outside this package; it reports without failing the build,
    # and its name says it is experimental.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '11.*', testbench: '9.*', stability: prefer-stable, experimental: false }
          - { php: '8.3', laravel: '11.*', testbench: '9.*', stability: prefer-stable, experimental: false }
          - { php: '8.4', laravel: '11.*', testbench: '9.*', stability: prefer-stable, experimental: false }

          - { php: '8.2', laravel: '12.*', testbench: '10.*', stability: prefer-stable, experimental: false }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', stability: prefer-stable, experimental: false }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', stability: prefer-stable, experimental: false }
          - { php: '8.5', laravel: '12.*', testbench: '10.*', stability: prefer-stable, experimental: false }

          - { php: '8.3', laravel: '13.*', testbench: '11.*', stability: prefer-stable, experimental: false }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable, experimental: false }
          - { php: '8.5', laravel: '13.*', testbench: '11.*', stability: prefer-stable, experimental: false }

          - { php: '8.5', laravel: 'dev-master as 14.0.0', testbench: '12.x-dev', stability: prefer-stable, experimental: true }

          # The oldest dependency versions the constraints allow, on the
          # oldest PHP: what a long-lived application is most likely to have.
          # Composer still skips versions with a known security advisory, so
          # apart from the framework (allowed in a step below) each package
          # gets its oldest version without one.
          - { php: '8.2', laravel: '11.*', testbench: '9.*', stability: prefer-lowest, experimental: false }

    steps:
      - uses: actions/checkout@v5

      # curl: the pinning tests (PinnedRequestsTest) send real requests
      # through it to a local `php -S` server.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, xmlwriter, mbstring, curl, pdo_sqlite, sqlite3
          coverage: none

      - name: Allow development versions
        if: matrix.experimental
        run: composer config minimum-stability dev

      # Unreleased Laravel: static analysis and the Inertia adapter may not
      # declare support for it yet. Static analysis runs in its own workflow,
      # and the Inertia tests skip themselves without the adapter, so drop
      # both here, and let Composer pick whatever Pest version resolves.
      - name: Relax tooling for the unreleased framework
        if: matrix.experimental
        run: |
          composer remove --dev larastan/larastan inertiajs/inertia-laravel --no-update --no-interaction
          composer require --dev "pestphp/pest:*" --no-update --no-interaction

      # Laravel 11 no longer gets security fixes, and every 11.x release is
      # affected by advisories published since, so Composer (2.9 and later)
      # refuses to install any of them. The package still supports Laravel
      # 11, so its rows allow the framework's advisories, and only those,
      # as an application staying on Laravel 11 has to.
      - name: Allow Laravel 11 despite its unfixed advisories
        if: matrix.laravel == '11.*'
        run: composer config --no-interaction --json policy.advisories.ignore '["laravel/framework"]'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      # For the log only: never fails the job.
      - name: Installed versions
        run: composer show --no-ansi | grep -E '^(laravel/framework|orchestra/testbench|pestphp/pest|phpunit/phpunit|inertiajs/inertia-laravel) ' || true

      - name: Tests
        run: vendor/bin/pest --ci

  # The migrations and every query the package runs, on each database it
  # supports, at the oldest version it supports where that matters (MariaDB
  # 10.6). SQLite in memory is the default everywhere else. Some tests run
  # only here: MigrationsTest checks declared column lengths, which SQLite
  # does not keep, and skips its rerun check on MySQL and MariaDB, where DDL
  # commits the test's transaction.
  database:
    name: ${{ matrix.database }} / PHP 8.4 / Laravel 13
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: sqlite, port: '0', username: '' }
          - { database: mysql, port: '3306', username: root }
          - { database: mariadb, port: '3307', username: root }
          - { database: pgsql, port: '5432', username: postgres }

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, xmlwriter, mbstring, curl, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" --no-interaction --no-update
          composer require --dev "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest --ci
